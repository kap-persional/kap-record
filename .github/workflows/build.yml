name: Build Android APK

on:
  push:
    branches:
      - 'main'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kap-record-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Runner Linux của GitHub Actions hỗ trợ KVM nhưng cần bật quyền truy cập thiết bị
      # /dev/kvm trước khi Android Emulator có thể chạy tăng tốc phần cứng.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: kap-record-debug-apk
          path: apk

      # Dựng Android Emulator thật, cài APK, mở app và xác nhận không bị crash ngay khi mở.
      # LƯU Ý: emulator KHÔNG mô phỏng đúng AudioPlaybackCaptureConfiguration (giới hạn đã
      # biết của chính nền tảng Android Emulator) — bước này chỉ xác nhận app không crash và
      # luồng khởi động cơ bản chạy được, KHÔNG xác nhận được việc ghi âm thanh nội bộ có
      # đúng hay không. Phần đó vẫn cần xác nhận trên thiết bị thật.
      - name: Boot emulator and verify app launches without crashing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash .github/scripts/emulator_smoke_test.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-test-logcat
          path: logcat.txt
          if-no-files-found: ignore
          retention-days: 14
